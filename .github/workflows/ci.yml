# Vérifications à chaque push et pull request : types, lint, format, tests unitaires, puis e2e dans Chrome.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Chrome est préinstallé sur les runners Ubuntu (/usr/bin/google-chrome) ; aperçus du registre non compilés ici.
      - run: npm run test:e2e
